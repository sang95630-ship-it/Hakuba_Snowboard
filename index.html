<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>白馬雪場比較</title>
  <meta name="description" content="白馬谷 5 大雪場：索道、雪道、雪票、交通、住宿與滑雪預算一站比較。"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
  <style>
/* ===== TOKENS ===== */
:root{
  --text-xs:clamp(.75rem,.7rem + .25vw,.875rem);
  --text-sm:clamp(.875rem,.8rem + .35vw,1rem);
  --text-base:clamp(1rem,.95rem + .25vw,1.125rem);
  --text-lg:clamp(1.125rem,1rem + .75vw,1.5rem);
  --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
  --text-2xl:clamp(2rem,1.2rem + 2.5vw,3.5rem);
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
  --space-12:3rem;--space-16:4rem;
  --radius-sm:.5rem;--radius-md:.8rem;--radius-lg:1.2rem;
  --radius-xl:1.6rem;--radius-full:9999px;
  --font-display:'Noto Serif TC',serif;
  --font-body:'Manrope','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
:root,[data-theme="light"]{
  --color-bg:#eef3f8;--color-surface:#f5f8fb;--color-surface-2:#fbfcfe;
  --color-surface-offset:#dde7f0;--color-surface-dynamic:#cfdce8;
  --color-divider:#cbd8e4;--color-border:#b8c9d9;
  --color-text:#1f2d3d;--color-text-muted:#546a80;--color-text-faint:#8a9db0;
  --color-text-inverse:#f8fbff;
  --color-primary:#2f6fa8;--color-primary-hover:#245a8a;--color-primary-highlight:#d6e6f5;
  --color-warn:#9a5b00;--color-warn-bg:#fdf1dc;
  --lv-beginner:#2e9d5b;--lv-intermediate:#d9443a;--lv-advanced:#1f2d3d;
  --shadow-sm:0 1px 3px rgba(31,45,61,.08);
  --shadow-md:0 8px 28px rgba(31,45,61,.10);
  --shadow-lg:0 20px 60px rgba(31,45,61,.16);
  color-scheme:light;
}
[data-theme="dark"]{
  --color-bg:#0f1824;--color-surface:#152131;--color-surface-2:#1b293b;
  --color-surface-offset:#223246;--color-surface-dynamic:#2b3e55;
  --color-divider:#2e4259;--color-border:#3a526d;
  --color-text:#e6eef6;--color-text-muted:#a9bccf;--color-text-faint:#7890a8;
  --color-text-inverse:#0f1824;
  --color-primary:#7fb6e6;--color-primary-hover:#a3cbef;--color-primary-highlight:#1e3a57;
  --color-warn:#f2b865;--color-warn-bg:#3a2a12;
  --lv-advanced:#e6eef6;
  --shadow-sm:0 1px 3px rgba(0,0,0,.3);
  --shadow-md:0 8px 28px rgba(0,0,0,.4);
  --shadow-lg:0 20px 60px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* ===== BASE ===== */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:5rem}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.65;
  background:var(--color-bg);color:var(--color-text);transition:background .3s,color .3s;
  overflow-x:hidden}
img{display:block;max-width:100%;height:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
a{color:var(--color-primary)}
a:hover{color:var(--color-primary-hover)}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
.container{width:min(1200px,calc(100% - 2rem));margin-inline:auto}
.skip-link{position:absolute;left:-999px;top:0}
.skip-link:focus{left:1rem;top:1rem;background:var(--color-primary);
  color:var(--color-text-inverse);padding:.75rem 1rem;border-radius:var(--radius-md);z-index:1000}
h1,h2,h3{font-family:var(--font-display);line-height:1.2}
.num{font-variant-numeric:tabular-nums}

/* ===== HEADER ===== */
.site-header{position:sticky;top:0;z-index:1100;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  background:color-mix(in srgb,var(--color-bg) 86%,transparent);
  border-bottom:1px solid color-mix(in srgb,var(--color-text) 10%,transparent)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);padding:.75rem 0}
.brand{display:flex;align-items:center;gap:.8rem;text-decoration:none;color:inherit;min-width:0}
.brand-mark{flex:none;width:40px;height:40px;padding:.45rem;border-radius:1rem;color:var(--color-primary);
  background:linear-gradient(135deg,var(--color-primary-highlight),var(--color-surface-offset));box-shadow:var(--shadow-sm)}
.brand-mark svg{width:100%;height:100%}
.brand-text{min-width:0}
.brand-text strong{display:block;font-size:var(--text-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-muted)}
.brand-text span{display:block;font-family:var(--font-display);font-size:var(--text-lg);white-space:nowrap}
.site-nav{display:flex;align-items:center;gap:1.1rem;flex-wrap:wrap}
.site-nav a{font-size:var(--text-sm);color:var(--color-text-muted);text-decoration:none;transition:color .18s;white-space:nowrap}
.site-nav a:hover{color:var(--color-primary)}
.site-nav a.active{color:var(--color-primary);font-weight:700}
.header-actions{display:flex;align-items:center;gap:.5rem}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--color-surface);
  border:1px solid color-mix(in srgb,var(--color-text) 10%,transparent)}
.nav-toggle{display:none}
@media(max-width:960px){
  .nav-toggle{display:grid}
  .site-nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;gap:0;
    background:var(--color-surface);border-bottom:1px solid var(--color-divider);box-shadow:var(--shadow-md);padding:.5rem 1rem}
  .site-nav.open{display:flex}
  .site-nav a{padding:.8rem .25rem;border-bottom:1px solid var(--color-divider)}
  .site-nav a:last-child{border-bottom:none}
}

/* ===== SECTIONS ===== */
.section{padding:clamp(2.5rem,6vw,4.5rem) 0;border-top:1px solid color-mix(in srgb,var(--color-text) 6%,transparent)}
.section-head{margin-bottom:var(--space-6)}
.section-head h2{font-size:var(--text-xl)}
.section-head p{margin-top:.4rem;color:var(--color-text-muted);max-width:70ch}
.card{padding:var(--space-5);border-radius:var(--radius-xl);background:var(--color-surface);
  border:1px solid color-mix(in srgb,var(--color-text) 9%,transparent);box-shadow:var(--shadow-sm)}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .65rem;border-radius:var(--radius-full);
  font-size:var(--text-xs);background:var(--color-primary-highlight);color:var(--color-primary-hover);white-space:nowrap}
[data-theme="dark"] .pill{color:var(--color-primary)}
.pill-row{display:flex;flex-wrap:wrap;gap:.4rem}
.tag-est,.tag-unk{display:inline-block;margin-left:.3rem;padding:0 .45rem;border-radius:var(--radius-full);
  font-size:.7rem;font-weight:600;vertical-align:.1em;white-space:nowrap;font-family:var(--font-body)}
.tag-est{background:var(--color-warn-bg);color:var(--color-warn)}
.tag-unk{background:var(--color-surface-offset);color:var(--color-text-muted)}
.tag-ok{display:inline-block;margin-left:.3rem;padding:0 .45rem;border-radius:var(--radius-full);font-size:.7rem;font-weight:600;vertical-align:.1em;white-space:nowrap;font-family:var(--font-body);
  background:color-mix(in srgb,var(--lv-beginner) 16%,transparent);color:var(--lv-beginner)}
.checked-list{list-style:none;display:grid;gap:.5rem;margin-top:.3rem}
.checked-list li{display:grid;grid-template-columns:1fr auto;gap:.1rem .6rem;padding-top:.5rem;border-top:1px dashed var(--color-divider)}
.checked-list li:first-child{border-top:none;padding-top:0}
.checked-list .ci-item{font-size:var(--text-sm)}
.checked-list .ci-cat{display:inline-block;margin-right:.3rem;padding:0 .4rem;border-radius:var(--radius-sm);font-size:.68rem;font-weight:700;background:var(--color-surface-offset);color:var(--color-text-muted);vertical-align:.1em}
.checked-list .ci-price{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:var(--text-sm);white-space:nowrap}
.checked-list .ci-meta{grid-column:1/-1;font-size:var(--text-xs);color:var(--color-text-muted)}
.checked-list .ci-meta a{font-weight:600}
.checked-list .ci-warn{color:var(--color-warn)}
.checked-list + .hint{margin-top:.6rem;padding-top:.5rem;border-top:1px solid var(--color-divider)}
.leg-list{list-style:none;display:grid;gap:.3rem;font-size:var(--text-xs);color:var(--color-text-muted)}
.leg-list li{display:flex;flex-wrap:wrap;gap:.2rem .5rem;align-items:baseline}
.leg-list strong{color:var(--color-text);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.55rem 1rem;border-radius:var(--radius-full);
  font-size:var(--text-sm);font-weight:600;text-decoration:none;background:var(--color-primary);color:var(--color-text-inverse);
  transition:background .18s;min-height:40px}
.btn:hover{background:var(--color-primary-hover);color:var(--color-text-inverse)}
.btn-ghost{background:var(--color-surface-offset);color:var(--color-text)}
.btn-ghost:hover{background:var(--color-surface-dynamic);color:var(--color-text)}

/* ===== HERO ===== */
.hero{padding:clamp(2rem,5vw,4rem) 0 clamp(2rem,4vw,3rem)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:var(--space-10);align-items:start}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem .85rem;border-radius:var(--radius-full);
  background:var(--color-primary-highlight);color:var(--color-primary);font-size:var(--text-xs);letter-spacing:.08em;margin-bottom:1rem}
h1{font-size:var(--text-2xl)}
.hero-body{margin-top:.9rem;color:var(--color-text-muted);max-width:60ch}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-top:var(--space-6)}
.stat-card{padding:var(--space-4) var(--space-5);border-radius:var(--radius-lg);background:var(--color-surface);
  border:1px solid color-mix(in srgb,var(--color-text) 9%,transparent);box-shadow:var(--shadow-sm)}
.stat-card span{display:block;font-size:var(--text-xs);color:var(--color-text-muted)}
.stat-card strong{display:block;font-size:var(--text-lg);font-variant-numeric:tabular-nums}
.stat-card small{display:block;font-size:var(--text-xs);color:var(--color-text-faint)}
.hero-aside{margin-top:var(--space-5)}
.hero-aside h2{font-size:var(--text-lg);margin-bottom:.5rem}
.note-list{list-style:none;display:grid;gap:.45rem}
.note-list li{position:relative;padding-left:1.1rem;font-size:var(--text-sm)}
.note-list li::before{content:"";position:absolute;left:0;top:.62em;width:.45rem;height:.45rem;border-radius:50%;background:var(--color-primary)}

/* map carousel */
.carousel{position:relative;border-radius:var(--radius-xl);overflow:hidden;background:var(--color-surface);
  border:1px solid color-mix(in srgb,var(--color-text) 9%,transparent);box-shadow:var(--shadow-md)}
.carousel-label{display:flex;align-items:center;gap:.4rem;font-size:var(--text-xs);color:var(--color-text-muted);margin-bottom:.5rem;letter-spacing:.06em}
.carousel-track{display:flex;transition:transform .45s cubic-bezier(.4,0,.2,1)}
.carousel-slide{flex:0 0 100%;position:relative;aspect-ratio:4/3;background:var(--color-surface-offset);cursor:zoom-in;border:0;padding:0;display:block}
.carousel-slide img{width:100%;height:100%;object-fit:contain}
.zoom-hint{position:absolute;right:.6rem;top:.6rem;padding:.25rem .6rem;border-radius:var(--radius-full);font-size:.72rem;
  background:rgba(15,24,36,.7);color:#fff;pointer-events:none}
.carousel-arrow{position:absolute;top:calc(50% - 1.6rem);transform:translateY(-50%);width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;background:rgba(255,255,255,.88);color:#1f2d3d;box-shadow:var(--shadow-sm)}
.carousel-arrow svg{width:20px;height:20px}
.carousel-prev{left:.6rem}.carousel-next{right:.6rem}
.carousel-footer{display:flex;align-items:center;gap:.75rem;padding:.7rem 1rem}
.carousel-dots{display:flex;gap:.35rem}
.carousel-dots button{width:8px;height:8px;border-radius:50%;background:var(--color-border);padding:0}
.carousel-dots button.active{background:var(--color-primary);width:20px;border-radius:4px}
.carousel-caption{flex:1;font-size:var(--text-sm);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.carousel-counter{font-size:var(--text-xs);color:var(--color-text-muted);font-variant-numeric:tabular-nums}

/* ===== LOCATION MAP ===== */
.location-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--space-6);align-items:start}
#resortMap{height:clamp(360px,55vh,520px);border-radius:var(--radius-xl);overflow:hidden;
  border:1px solid color-mix(in srgb,var(--color-text) 9%,transparent);box-shadow:var(--shadow-md);background:var(--color-surface-offset);z-index:0}
[data-theme="dark"] #resortMap .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
.map-fallback{width:100%;height:100%;display:block}
.map-fallback .river{fill:none;stroke:var(--color-primary);stroke-width:3;opacity:.35}
.map-fallback text{fill:var(--color-text);font-size:13px;font-family:var(--font-body)}
.map-fallback .axis{fill:var(--color-text-faint);font-size:11px}
.map-fallback a:focus-visible circle{stroke:var(--color-primary);stroke-width:4}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--color-primary);
  border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center}
.pin span{transform:rotate(45deg);color:#fff;font-weight:700;font-size:13px;font-family:var(--font-body)}
.leaflet-div-icon.pin-wrap{background:none;border:none}
.leaflet-popup-content{margin:.8rem 1rem;font-family:var(--font-body);line-height:1.5}
.popup h3{font-size:1rem;margin-bottom:.2rem}
.popup p{margin:.15rem 0;font-size:.85rem;color:#546a80}
.popup .btn{margin-top:.5rem;font-size:.85rem;padding:.4rem .9rem;min-height:34px;color:#fff}
.loc-list{list-style:none;display:grid;gap:.6rem}
.loc-item{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border-radius:var(--radius-lg);background:var(--color-surface);
  border:1px solid color-mix(in srgb,var(--color-text) 9%,transparent)}
.loc-num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--color-primary);color:var(--color-text-inverse);font-weight:700;font-size:.85rem}
.loc-body{flex:1;min-width:0}
.loc-body strong{display:block}
.loc-body small{display:block;color:var(--color-text-muted);font-size:var(--text-xs);overflow-wrap:anywhere}
.loc-actions{display:flex;gap:.35rem;flex:none}
.loc-actions .btn{padding:.4rem .75rem;min-height:36px;font-size:var(--text-xs)}
.map-note{margin-top:.6rem;font-size:var(--text-xs);color:var(--color-text-muted)}

/* ===== COMPARE TABLE ===== */
.table-wrap{overflow-x:auto;border-radius:var(--radius-xl);border:1px solid color-mix(in srgb,var(--color-text) 9%,transparent);
  background:var(--color-surface);box-shadow:var(--shadow-sm);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:var(--text-sm)}
th,td{padding:.75rem .8rem;text-align:right;border-bottom:1px solid var(--color-divider);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--color-surface);z-index:1}
thead th{background:var(--color-surface-offset);font-weight:700;font-size:var(--text-xs);color:var(--color-text-muted)}
thead th:first-child{background:var(--color-surface-offset)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--color-surface-2)}
.sort-btn{display:inline-flex;align-items:center;gap:.25rem;font-weight:700;font-size:var(--text-xs);color:inherit;padding:.2rem 0}
.sort-btn .arrow{opacity:.35;font-size:.7rem}
th[aria-sort="ascending"] .arrow,th[aria-sort="descending"] .arrow{opacity:1;color:var(--color-primary)}
.best{color:var(--lv-beginner);font-weight:700}
.stars{color:#e0a100;letter-spacing:.05em}
.table-hint{margin-top:.6rem;font-size:var(--text-xs);color:var(--color-text-muted)}

/* ratio bar */
.ratio{display:flex;height:10px;border-radius:var(--radius-full);overflow:hidden;background:var(--color-surface-offset);min-width:90px}
.ratio i{display:block;height:100%}
.ratio .b{background:var(--lv-beginner)}.ratio .m{background:var(--lv-intermediate)}.ratio .a{background:var(--lv-advanced)}
.ratio-legend{display:flex;gap:.8rem;flex-wrap:wrap;font-size:var(--text-xs);color:var(--color-text-muted);margin-top:.35rem}
.ratio-legend :is(.b,.m,.a)::before{content:"";display:inline-block;width:.6rem;height:.6rem;border-radius:2px;margin-right:.3rem;vertical-align:-.05em}
.ratio-legend .b::before{background:var(--lv-beginner)}.ratio-legend .m::before{background:var(--lv-intermediate)}.ratio-legend .a::before{background:var(--lv-advanced)}

/* ===== RESORT FLIP CARDS ===== */
.resort-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:var(--space-5)}
.flip{perspective:1600px}
.flip-inner{display:grid;transition:transform .7s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flip.is-flipped .flip-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;gap:var(--space-4)}
.face.back{transform:rotateY(180deg)}
.flip:not(.is-flipped) .face.back,.flip.is-flipped .face.front{visibility:hidden;transition:visibility 0s .35s}
.flip.is-flipped .face.back,.flip:not(.is-flipped) .face.front{visibility:visible;transition:visibility 0s 0s}
@media (prefers-reduced-motion:reduce){.flip-inner{transition:none}}
.face-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem}
.face-head h3{font-size:var(--text-lg)}
.face-head small{display:block;color:var(--color-text-muted);font-size:var(--text-xs)}
.flip-btn{flex:none;padding:.4rem .8rem;border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:700;
  background:var(--color-primary-highlight);color:var(--color-primary-hover);min-height:36px}
[data-theme="dark"] .flip-btn{color:var(--color-primary)}
.thumb-btn{display:block;position:relative;border-radius:var(--radius-lg);overflow:hidden;cursor:zoom-in;padding:0;aspect-ratio:4/3;background:var(--color-surface-offset)}
.thumb-btn img{width:100%;height:100%;object-fit:contain;transition:transform .3s}
.thumb-btn:hover img{transform:scale(1.03)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:.5rem .9rem}
.kv div{padding:.55rem .7rem;border-radius:var(--radius-md);background:var(--color-surface-2);border:1px solid var(--color-divider)}
.kv > div > span{display:block;font-size:var(--text-xs);color:var(--color-text-muted)}
.kv strong{font-size:var(--text-sm);font-variant-numeric:tabular-nums}
.summary{font-size:var(--text-sm);color:var(--color-text-muted)}
.info-box{padding:.7rem .85rem;border-radius:var(--radius-md);background:var(--color-surface-2);border:1px solid var(--color-divider)}
.info-box .label{font-size:var(--text-xs);font-weight:700;color:var(--color-primary);letter-spacing:.04em;margin-bottom:.2rem}
.info-box p{font-size:var(--text-sm)}
.link-row{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:auto}
.link-row .btn{font-size:var(--text-xs);padding:.4rem .8rem;min-height:36px}

/* ===== BUDGET ===== */
.budget-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--space-5);align-items:start}
.budget-form{display:grid;gap:var(--space-4)}
.budget-form fieldset{border:none;display:grid;gap:.7rem}
.budget-form legend{font-family:var(--font-display);font-size:var(--text-lg);font-weight:700;margin-bottom:.5rem}
.field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem}
.field{display:grid;gap:.25rem}
.field label,.field .flabel{font-size:var(--text-xs);color:var(--color-text-muted);font-weight:600}
.field input[type=number],.field select{width:100%;padding:.55rem .7rem;border-radius:var(--radius-md);border:1px solid var(--color-border);
  background:var(--color-surface-2);min-height:42px;font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:.55rem;padding:.55rem .7rem;border-radius:var(--radius-md);background:var(--color-surface-2);
  border:1px solid var(--color-divider);font-size:var(--text-sm);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--color-primary);flex:none}
.check .price{margin-left:auto;color:var(--color-text-muted);font-variant-numeric:tabular-nums;font-size:var(--text-xs)}
.day-list{display:grid;gap:.45rem}
.day-row{display:grid;grid-template-columns:4.2rem 1fr;align-items:center;gap:.6rem}
.day-row span{font-size:var(--text-xs);font-weight:700;color:var(--color-text-muted)}
.day-row select{width:100%;padding:.5rem .6rem;border-radius:var(--radius-md);border:1px solid var(--color-border);background:var(--color-surface-2);min-height:40px}
.quick-row{display:flex;flex-wrap:wrap;gap:.4rem}
.quick-row button{font-size:var(--text-xs);padding:.3rem .7rem;border-radius:var(--radius-full);background:var(--color-surface-offset);min-height:32px}
.quick-row button:hover{background:var(--color-surface-dynamic)}
.hint{font-size:var(--text-xs);color:var(--color-text-muted)}
.budget-result{position:sticky;top:5.5rem}
.budget-result h3{font-size:var(--text-lg);margin-bottom:.6rem}
.res-row{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;padding:.6rem 0;border-bottom:1px solid var(--color-divider)}
.res-row span{font-size:var(--text-sm)}
.res-row strong{text-align:right;font-variant-numeric:tabular-nums}
.res-row small{grid-column:1/-1;font-size:var(--text-xs);color:var(--color-text-muted)}
.res-row .hkd{grid-column:2;text-align:right;font-size:var(--text-xs);color:var(--color-text-muted);font-variant-numeric:tabular-nums}
.res-total{border-bottom:none;padding-top:.9rem}
.res-total strong{font-size:var(--text-xl);color:var(--color-primary)}
.res-total .hkd{font-size:var(--text-sm);font-weight:700;color:var(--color-text)}
.alert{margin-top:.8rem;padding:.7rem .9rem;border-radius:var(--radius-md);font-size:var(--text-sm);background:var(--color-warn-bg);color:var(--color-warn)}
.alert.ok{background:color-mix(in srgb,var(--lv-beginner) 14%,transparent);color:var(--lv-beginner)}
.rate-note{margin-top:.6rem;font-size:var(--text-xs);color:var(--color-text-muted)}
.budget-sticky{display:none}
@media(max-width:960px){
  .budget-sticky.show{display:flex;align-items:center;gap:.6rem;position:fixed;left:1rem;right:1rem;bottom:max(1rem,env(safe-area-inset-bottom));z-index:1000;
    padding:.7rem 1rem;border-radius:var(--radius-full);background:var(--color-primary);color:var(--color-text-inverse);text-decoration:none;box-shadow:var(--shadow-lg);font-variant-numeric:tabular-nums}
  .budget-sticky.show:hover{color:var(--color-text-inverse)}
  .budget-sticky span{font-size:var(--text-xs);opacity:.9}
  .budget-sticky strong{font-size:var(--text-base)}
  .budget-sticky .go{margin-left:auto}
  #budget{padding-bottom:6rem}
}
[data-theme="dark"] .leaflet-bar a{background:var(--color-surface-2);color:var(--color-text);border-bottom-color:var(--color-border)}
[data-theme="dark"] .leaflet-bar a:hover{background:var(--color-surface-dynamic)}
[data-theme="dark"] .leaflet-control-attribution{background:rgba(21,33,49,.85);color:var(--color-text-muted)}
[data-theme="dark"] .leaflet-control-attribution a{color:var(--color-primary)}

/* ===== STAY / NOTES ===== */
.stay-grid,.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:var(--space-4)}
.stay-card h3,.note-card h3{font-size:var(--text-lg);margin-bottom:.5rem}
.stay-card .price{font-size:var(--text-lg);font-weight:700;font-variant-numeric:tabular-nums;margin:.3rem 0}
.plain-list{list-style:none;display:grid;gap:.4rem;font-size:var(--text-sm)}
.plain-list li{padding-left:1rem;position:relative}
.plain-list li::before{content:"–";position:absolute;left:0;color:var(--color-text-faint)}

footer{padding:2rem 0 3rem;font-size:var(--text-xs);color:var(--color-text-muted);border-top:1px solid var(--color-divider)}
footer p+p{margin-top:.3rem}

/* ===== LIGHTBOX ===== */
.lightbox{position:fixed;inset:0;z-index:2000;background:rgba(6,12,20,.97);display:none;flex-direction:column;touch-action:none;overscroll-behavior:contain}
.lightbox.open{display:flex}
.lb-bar{display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem;color:#fff;background:#060c14;position:relative;z-index:3}
.lb-caption{flex:1;font-size:var(--text-sm);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;font-size:1.2rem;flex:none}
.lb-btn:hover{background:rgba(255,255,255,.22)}
.lb-zoom-level{font-size:var(--text-xs);color:rgba(255,255,255,.75);min-width:3.2rem;text-align:center;font-variant-numeric:tabular-nums}
.lb-stage{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab}
.lb-stage.dragging{cursor:grabbing}
.lb-stage img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none;will-change:transform}
.lb-loading{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.7);font-size:var(--text-sm);pointer-events:none}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2}
.lb-prev{left:.6rem}.lb-next{right:.6rem}
.lb-help{text-align:center;padding:.4rem .8rem .7rem;font-size:.72rem;color:rgba(255,255,255,.6)}

/* ===== LOADING / ERROR ===== */
.load-error{margin:3rem auto;max-width:640px;padding:1.5rem;border-radius:var(--radius-xl);background:var(--color-warn-bg);color:var(--color-warn)}
.load-error code{font-size:.85em}

/* ===== RESPONSIVE ===== */
@media(max-width:960px){
  .hero-grid,.location-grid,.budget-grid{grid-template-columns:minmax(0,1fr)}
  .budget-result{position:static}
}
@media(max-width:600px){
  .container{width:calc(100% - 2rem)}
  .brand-text strong{display:none}
  .stats{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:1fr 1fr}
  .loc-item{flex-wrap:wrap}
  .loc-actions{width:100%;padding-left:2.6rem}
  .carousel-arrow{width:34px;height:34px}
}
  </style>
</head>
<body>
<a class="skip-link" href="#main">跳至主要內容</a>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="#overview" aria-label="白馬雪場比較 回到頂部">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 48L22 22L31 34L40 18L58 48" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18 29L22 22L26 28" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="14" y="52" width="36" height="6" rx="3" transform="rotate(-8 32 55)" fill="currentColor"/>
        </svg>
      </div>
      <div class="brand-text">
        <strong>Hakuba Valley · 5 Resorts</strong>
        <span>白馬雪場比較</span>
      </div>
    </a>
    <nav class="site-nav" id="siteNav" aria-label="頁面導覽">
      <a href="#overview">總覽</a>
      <a href="#location">雪場位置</a>
      <a href="#compare">比較表</a>
      <a href="#resorts">雪場詳情</a>
      <a href="#budget">預算試算</a>
      <a href="#stay">住宿</a>
      <a href="#notes">注意事項</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn nav-toggle" id="navToggle" type="button" aria-label="開啟導覽選單" aria-expanded="false" aria-controls="siteNav">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="切換深色模式"></button>
    </div>
  </div>
</header>

<main id="main">
  <div id="app" aria-live="polite">
    <p class="container" style="padding:3rem 0;color:var(--color-text-muted)">載入雪場數據中…</p>
  </div>
</main>

<footer>
  <div class="container" id="footer"></div>
</footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="雪場地圖放大檢視" aria-hidden="true">
  <div class="lb-bar">
    <p class="lb-caption" id="lbCaption"></p>
    <button class="lb-btn" type="button" id="lbZoomOut" aria-label="縮小">−</button>
    <span class="lb-zoom-level" id="lbZoomLevel">100%</span>
    <button class="lb-btn" type="button" id="lbZoomIn" aria-label="放大">+</button>
    <button class="lb-btn" type="button" id="lbReset" aria-label="重設縮放" title="重設">⟲</button>
    <button class="lb-btn" type="button" id="lbClose" aria-label="關閉">×</button>
  </div>
  <div class="lb-stage" id="lbStage">
    <img id="lbImg" alt="" draggable="false">
    <div class="lb-loading" id="lbLoading">載入全清地圖…</div>
    <button class="lb-btn lb-nav lb-prev" type="button" id="lbPrev" aria-label="上一張">‹</button>
    <button class="lb-btn lb-nav lb-next" type="button" id="lbNext" aria-label="下一張">›</button>
  </div>
  <p class="lb-help">滾輪 / 雙指縮放 · 拖曳移動 · 雙擊放大或還原 · ← → 切換 · Esc 關閉</p>
</div>

<script src="assets/vendor/leaflet/leaflet.js"></script>
<script>
'use strict';

/* ===== HELPERS ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => (typeof u === 'string' && /^https?:\/\//i.test(u)) ? u : '#';
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const fmtInt = n => Math.round(n).toLocaleString('en-US');
const yen = n => '¥' + fmtInt(n);
const hkd = (n, rate) => 'HK$' + fmtInt(n * rate);
const orDash = (v, f = x => x) => isNum(v) ? f(v) : '—';
const tagEst = '<span class="tag-est" title="依比例或類型推算，非官方數字">估算</span>';
const tagUnk = '<span class="tag-unk">未公開</span>';
const tagOk = '<span class="tag-ok" title="用戶已人手核對官方或訂購頁面">✓ 已核實</span>';
const extLink = (url, label, cls = 'btn btn-ghost') =>
  `<a class="${cls}" href="${esc(safeUrl(url))}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`;
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};

/* ===== THEME ===== */
(function initTheme(){
  const root = document.documentElement;
  const btn = $('#themeToggle');
  const saved = store.get('hakuba-theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  let mode = (saved === 'dark' || saved === 'light') ? saved : (prefersDark ? 'dark' : 'light');
  const sun = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
  const moon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  const apply = () => {
    root.setAttribute('data-theme', mode);
    btn.innerHTML = mode === 'dark' ? sun : moon;
    btn.setAttribute('aria-label', mode === 'dark' ? '切換淺色模式' : '切換深色模式');
  };
  apply();
  btn.addEventListener('click', () => { mode = mode === 'dark' ? 'light' : 'dark'; store.set('hakuba-theme', mode); apply(); });
})();

/* ===== MOBILE NAV ===== */
(function initNav(){
  const toggle = $('#navToggle'), nav = $('#siteNav');
  const close = () => { nav.classList.remove('open'); toggle.setAttribute('aria-expanded', 'false'); toggle.setAttribute('aria-label', '開啟導覽選單'); };
  toggle.addEventListener('click', () => {
    const open = !nav.classList.contains('open');
    nav.classList.toggle('open', open);
    toggle.setAttribute('aria-expanded', String(open));
    toggle.setAttribute('aria-label', open ? '關閉導覽選單' : '開啟導覽選單');
  });
  nav.addEventListener('click', e => { if (e.target.closest('a')) close(); });
  document.addEventListener('click', e => { if (!e.target.closest('.site-header')) close(); });
  window.addEventListener('resize', () => { if (window.innerWidth > 960) close(); });
})();

/* ===== DATA LOAD ===== */
fetch('data/resorts.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(render)
  .catch(err => {
    console.error(err);
    $('#app').innerHTML = `<div class="load-error container"><h2>無法載入雪場數據</h2>
      <p>請透過 GitHub Pages 或本地伺服器開啟本頁（直接雙擊 <code>index.html</code> 時瀏覽器會封鎖讀取 JSON）。</p>
      <p>本地預覽：在專案資料夾執行 <code>python3 -m http.server</code>，再開啟 <code>http://localhost:8000</code>。</p>
      <p class="hint">錯誤：${esc(err.message)}</p></div>`;
  });

/* ===== RENDER ===== */
function render(data){
  const R = data.resorts;
  const meta = data.meta;
  // 地圖次序：由北至南
  const byNorth = [...R].sort((a, b) => b.location.lat - a.location.lat);
  const app = $('#app');
  app.innerHTML = [
    heroHTML(R, meta),
    locationHTML(byNorth),
    compareHTML(),
    resortsHTML(R, meta),
    budgetHTML(R, meta),
    stayHTML(R),
    notesHTML(meta)
  ].join('');
  $('#footer').innerHTML = `<p>資料整理：${esc(meta.compiled)} · 雪票為 2025-26 季大人 1 日券 · 估算數字已標示「估算」。</p>
    <p>來源：skiresort、各雪場官網、Hakuba Valley 官方、Alpico · 地圖 © OpenStreetMap contributors · 本站僅供參考，出發前請以官方公佈為準。</p>`;

  initCarousel(R);
  initLocationMap(byNorth);
  initCompare(R);
  initFlip();
  initBudget(R, meta);
  initLightboxTriggers(R);
  initScrollSpy();
}

/* ----- HERO ----- */
function heroHTML(R, meta){
  const totalKm = R.reduce((s, r) => s + (r.slopes.totalKm || 0), 0);
  const maxScore = Math.max(...R.map(r => r.beginnerScore));
  const bestBeg = R.filter(r => r.beginnerScore === maxScore).map(r => r.name).join('、');
  const cheapest = R.reduce((a, b) => a.ticket.adult1Day <= b.ticket.adult1Day ? a : b);
  const vp = meta.valleyPass;
  return `
<section class="hero" id="overview">
  <div class="container hero-grid">
    <div>
      <span class="eyebrow">HAKUBA VALLEY · 2026-27 雪季準備</span>
      <h1>白馬 5 大雪場比較</h1>
      <p class="hero-body">一次比較八方尾根、五竜 &amp; 47、岩岳、栂池、鹿島槍的索道、雪道、雪票、交通與住宿，並按人數日數試算滑雪預算（JPY / HKD）。</p>
      <div class="stats">
        <div class="stat-card"><span>雪道總長（5 場合計）</span><strong>${totalKm.toFixed(1)} km</strong><small>${R.length} 個雪場</small></div>
        <div class="stat-card"><span>全山通票 1 日</span><strong>${yen(vp.adult1Day_2026_27)}</strong><small>2026-27 季 · 10 場通用</small></div>
        <div class="stat-card"><span>最適合初學</span><strong>${esc(bestBeg)}</strong><small>初學友善度 ${'★'.repeat(maxScore)}</small></div>
        <div class="stat-card"><span>最平 1 日券</span><strong>${yen(cheapest.ticket.adult1Day)}</strong><small>${esc(cheapest.name)} · 2025-26 季</small></div>
      </div>
      <div class="card hero-aside">
        <h2>選場邏輯</h2>
        <ul class="note-list">
          <li>初學為主 → <strong>栂池</strong>（最闊初級坡）或 <strong>鹿島槍</strong>（初中級 85%、雪票最平）</li>
          <li>中級、想避人潮 → <strong>岩岳</strong></li>
          <li>中高級、想滑最多雪道 → <strong>八方尾根</strong>（52 km、落差 1,071 m）</li>
          <li>想夜滑 → <strong>五竜 &amp; 47</strong>（とおみ區）</li>
          <li>每天轉場才值得買全山通票，可用下方預算試算比較</li>
        </ul>
      </div>
    </div>
    <div>
      <div class="carousel-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
        雪場地圖 · 點擊放大看全清版
      </div>
      <div class="carousel" id="carousel" role="region" aria-roledescription="carousel" aria-label="雪場地圖輪播">
        <div class="carousel-track" id="carouselTrack">
          ${R.map((r, i) => `<button class="carousel-slide" type="button" data-lightbox="${i}" aria-label="放大 ${esc(r.name)} 雪場地圖"${i ? ' tabindex="-1"' : ''}>
            <img src="${esc(r.trailMap.thumb)}" alt="${esc(r.name)} 雪場地圖" width="${r.trailMap.width}" height="${r.trailMap.height}" ${i ? 'loading="lazy"' : ''}>
            <span class="zoom-hint">🔍 放大</span></button>`).join('')}
        </div>
        <button class="carousel-arrow carousel-prev" type="button" id="carPrev" aria-label="上一張地圖"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></button>
        <button class="carousel-arrow carousel-next" type="button" id="carNext" aria-label="下一張地圖"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></button>
        <div class="carousel-footer">
          <div class="carousel-dots" id="carDots">${R.map((r, i) => `<button type="button" aria-label="第 ${i + 1} 張：${esc(r.name)}"></button>`).join('')}</div>
          <p class="carousel-caption" id="carCaption"></p>
          <span class="carousel-counter" id="carCounter"></span>
        </div>
      </div>
    </div>
  </div>
</section>`;
}

/* ----- LOCATION ----- */
function locationHTML(list){
  const anyEst = list.some(r => r.location.coordStatus !== 'verified');
  return `
<section class="section" id="location">
  <div class="container">
    <div class="section-head"><h2>雪場位置</h2><p>由北至南排列。點擊地圖標記或清單上的「Google Maps」按鈕，即可開啟導航（手機會自動開啟 Google Maps App）。</p></div>
    <div class="location-grid">
      <div>
        <div id="resortMap" role="region" aria-label="白馬谷雪場位置地圖"></div>
        ${anyEst ? '<p class="map-note">⚠ 地圖標記位置為估算座標，可能與實際入口相差數百米；Google Maps 按鈕以雪場正式名稱搜尋，定位不受影響。</p>' : ''}
      </div>
      <ol class="loc-list">
        ${list.map((r, i) => `<li class="loc-item">
          <span class="loc-num">${i + 1}</span>
          <div class="loc-body"><strong>${esc(r.name)}</strong><small>${esc(r.location.address)}</small></div>
          <div class="loc-actions">
            <button class="btn btn-ghost" type="button" data-focus-marker="${esc(r.id)}" aria-label="在地圖上顯示 ${esc(r.name)}">地圖</button>
            ${extLink(r.location.googleMapsUrl, 'Google Maps', 'btn')}
          </div></li>`).join('')}
      </ol>
    </div>
  </div>
</section>`;
}

/* ----- COMPARE ----- */
const COLS = [
  { key: 'name', label: '雪場', get: r => r.name, fmt: (v, r) => `<a href="#card-${esc(r.id)}">${esc(v)}</a>`, text: true },
  { key: 'ticket', label: '1 日券', get: r => r.ticket.adult1Day, fmt: (v, r) => yen(v) + (r.ticket.status === 'verified' ? ' <span class="tag-ok" title="已核實">✓</span>' : ''), best: 'min' },
  { key: 'km', label: '雪道長度', get: r => r.slopes.totalKm, fmt: v => v + ' km', best: 'max' },
  { key: 'runs', label: '雪道數', get: r => r.slopes.runs, fmt: v => v, best: 'max' },
  { key: 'begint', label: '初+中級', get: r => r.slopes.ratio.beginner + r.slopes.ratio.intermediate, fmt: v => v + '%', best: 'max' },

];
function ratioBar(ratio){
  return `<div class="ratio" role="img" aria-label="初級 ${ratio.beginner}%，中級 ${ratio.intermediate}%，高級 ${ratio.advanced}%">
    <i class="b" style="width:${ratio.beginner}%"></i><i class="m" style="width:${ratio.intermediate}%"></i><i class="a" style="width:${ratio.advanced}%"></i></div>`;
}
function compareHTML(){
  return `
<section class="section" id="compare">
  <div class="container">
    <div class="section-head"><h2>總覽比較表</h2><p>點擊表頭可排序；綠色粗體為該項最佳。</p></div>
    <div class="table-wrap" tabindex="0" role="region" aria-label="雪場比較表（可橫向捲動）">
      <table id="compareTable">
        <thead><tr>${COLS.map(c => c.noSort
          ? `<th scope="col">${c.label}</th>`
          : `<th scope="col" aria-sort="none"><button class="sort-btn" type="button" data-sort="${c.key}">${c.label}<span class="arrow" aria-hidden="true">↕</span></button></th>`).join('')}</tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="ratio-legend"><span class="b">初級</span><span class="m">中級</span><span class="a">高級</span></div>
    <p class="table-hint">手機可左右滑動表格。雪票為 2025-26 季大人 1 日券窗口價，<strong>栂池除外：採用已核實的 2026-27 早鳥價 ¥6,500</strong>（須於 2026-11-30 前購買、不可取消）；總運力「未公開」表示官方及 skiresort 均未提供。</p>
  </div>
</section>`;
}
function initCompare(R){
  const tbody = $('#compareTable tbody');
  const best = {};
  COLS.forEach(c => {
    if (!c.best) return;
    const vals = R.map(c.get).filter(isNum);
    best[c.key] = c.best === 'min' ? Math.min(...vals) : Math.max(...vals);
  });
  let sortKey = null, dir = 1;
  const draw = () => {
    let rows = [...R];
    if (sortKey) {
      const col = COLS.find(c => c.key === sortKey);
      rows.sort((a, b) => {
        const va = col.get(a), vb = col.get(b);
        if (col.text) return String(va).localeCompare(String(vb), 'zh-Hant') * dir;
        const na = isNum(va), nb = isNum(vb);
        if (!na && !nb) return 0;
        if (!na) return 1;           // 無數據永遠排最後
        if (!nb) return -1;
        return (va - vb) * dir;
      });
    }
    tbody.innerHTML = rows.map(r => `<tr>${COLS.map((c, i) => {
      const v = c.get(r);
      const cls = c.best && isNum(v) && v === best[c.key] ? ' class="best"' : '';
      const cell = c.fmt(v, r);
      return i === 0 ? `<th scope="row">${cell}</th>` : `<td${cls}>${cell}</td>`;
    }).join('')}</tr>`).join('');
  };
  $$('#compareTable .sort-btn').forEach(btn => btn.addEventListener('click', () => {
    const key = btn.dataset.sort;
    if (sortKey === key) dir = -dir;
    else { sortKey = key; const col = COLS.find(c => c.key === key); dir = col.best === 'min' || col.text ? 1 : -1; }
    $$('#compareTable thead th').forEach(th => th.hasAttribute('aria-sort') && th.setAttribute('aria-sort', 'none'));
    const th = btn.closest('th');
    th.setAttribute('aria-sort', dir === 1 ? 'ascending' : 'descending');
    btn.querySelector('.arrow').textContent = dir === 1 ? '↑' : '↓';
    $$('#compareTable .sort-btn').forEach(b => { if (b !== btn) b.querySelector('.arrow').textContent = '↕'; });
    draw();
  }));
  draw();
}

function initBudget(R, meta){
  const c = meta.costs, rt = c.rental;
  const VALLEY = meta.valleyPass.adult1Day_2025_26;
  const shuttleFare = c.localTransport.valleyShuttle.perRide;
  const byId = Object.fromEntries(R.map(r => [r.id, r]));
  const el = id => document.getElementById(id);
  const dayChoices = [];              // 保留用戶已選的每日雪場
  const defaultResort = 'tsugaike' in byId ? 'tsugaike' : R[0].id;
  el('bBase').value = defaultResort;

  const clampInt = (input, min, max, fallback) => {
    let v = parseInt(input.value, 10);
    if (!Number.isFinite(v)) v = fallback;
    return Math.min(max, Math.max(min, v));
  };
  const midPrice = id => { const [a, b] = byId[id].lodging.priceRangePerRoomNight; return Math.round((a + b) / 2 / 1000) * 1000; };
  let roomPriceTouched = false, roomsTouched = false, rentTouched = false;

  const setRoomPrice = () => {
    const r = byId[el('bBase').value];
    const [a, b] = r.lodging.priceRangePerRoomNight;
    if (!roomPriceTouched) el('bRoomPrice').value = midPrice(r.id);
    el('roomHint').textContent = `${r.name} 旺季參考：${yen(a)}–${yen(b)}／房／晚（預設取中位數，可手動修改）`;
  };

  const buildDays = () => {
    const days = clampInt(el('bDays'), 1, 14, 5);
    while (dayChoices.length < days) dayChoices.push(dayChoices.length ? dayChoices[dayChoices.length - 1] : defaultResort);
    const opts = id => `<option value="valley"${id === 'valley' ? ' selected' : ''}>全山通票（${yen(VALLEY)}）</option>` +
      R.map(r => `<option value="${esc(r.id)}"${r.id === id ? ' selected' : ''}>${esc(r.name)}（${yen(r.ticket.adult1Day)}${r.ticket.priceType === 'early-bird' ? ' 早鳥' : ''}）</option>`).join('');
    el('dayList').innerHTML = Array.from({ length: days }, (_, i) =>
      `<div class="day-row"><span>Day ${i + 1}</span><select data-day="${i}" aria-label="Day ${i + 1} 雪票">${opts(dayChoices[i])}</select></div>`).join('');
  };

  const calc = () => {
    const people = clampInt(el('bPeople'), 1, 20, 2);
    const days = clampInt(el('bDays'), 1, 14, 5);
    const nights = clampInt(el('bNights'), 0, 21, 5);
    const rooms = clampInt(el('bRooms'), 1, 20, 1);
    const roomPrice = Math.max(0, parseFloat(el('bRoomPrice').value) || 0);
    const shuttlePerDay = clampInt(el('bShuttle'), 0, 10, 2);
    const rentPeople = clampInt(el('bRentPeople'), 0, 20, people);
    let rate = parseFloat(el('bRate').value);
    const rateOk = Number.isFinite(rate) && rate > 0;
    if (!rateOk) rate = meta.exchangeRate.rate;
    const pkg = c.transportPackages.find(p => p.id === el('bRoute').value) || c.transportPackages[0];
    const legs = (pkg.legs || []).map(id => c.transport.find(t => t.id === id)).filter(Boolean);
    el('legList').innerHTML = legs.map(t => `<li><span>${esc(t.name)}</span><strong>${yen(t.typical)}</strong>${t.status === 'verified' ? tagOk : tagEst}${t.url ? `<a href="${esc(safeUrl(t.url))}" target="_blank" rel="noopener noreferrer">來源 ↗</a>` : ''}</li>`).join('');

    const choices = dayChoices.slice(0, days);
    const ticketPerPerson = choices.reduce((s, id) => s + (id === 'valley' ? VALLEY : byId[id].ticket.adult1Day), 0);
    const paidShuttleDays = choices.filter(id => id !== 'valley').length;
    const ticket = ticketPerPerson * people;
    const lodging = roomPrice * rooms * nights;
    const transportMain = pkg.typical * 2 * people;
    const shuttle = shuttleFare * shuttlePerDay * paidShuttleDays * people;
    const transport = transportMain + shuttle;
    const perDayRent = (el('rBoard').checked ? rt.snowboardSet.perDayTypical : 0)
                     + (el('rWear').checked ? rt.wearSet.perDayTypical : 0)
                     + (el('rHelmet').checked ? rt.helmet.perDayTypical : 0);
    const cover = el('rCover').checked && perDayRent > 0 ? rt.damageCover.perRental : 0;
    const rental = (perDayRent * days + cover) * rentPeople;
    const total = ticket + lodging + transport + rental;

    const row = (label, v, sub) => `<div class="res-row"><span>${label}</span><strong>${yen(v)}</strong><span class="hkd">${hkd(v, rate)}</span>${sub ? `<small>${sub}</small>` : ''}</div>`;
    el('resultRows').innerHTML =
      row('雪票', ticket, `${people} 人 × ${days} 日，每人 ${yen(ticketPerPerson)}`) +
      row('住宿', lodging, `${rooms} 房 × ${nights} 晚 × ${yen(roomPrice)}`) +
      row('交通', transport, `往返 ${yen(pkg.typical)} × 2 程 × ${people} 人 = ${yen(transportMain)}` + (shuttle ? `；接駁巴士 ${yen(shuttle)}` : '；接駁巴士 ¥0')) +
      row('雪具租借', rental, rentPeople && perDayRent ? `${rentPeople} 人 × ${days} 日 × ${yen(perDayRent)}` + (cover ? ` + 保障 ${yen(cover)}／人` : '') : '不租借') +
      `<div class="res-row res-total"><span>總額</span><strong id="totalJpy">${yen(total)}</strong><span class="hkd" id="totalHkd">${hkd(total, rate)}</span>
        <small>每人平均 ${yen(total / people)}（${hkd(total / people, rate)}）</small></div>`;

    // 全山通票建議：比較「全部改用全山通票」與目前選擇（含接駁巴士）
    const allValley = VALLEY * days * people;
    const current = ticket + shuttle;
    const diff = allValley - current;
    const allPass = paidShuttleDays === 0;
    let advice;
    if (allPass) advice = `<p class="alert ok">已全部使用全山通票，接駁巴士免費。</p>`;
    else if (diff < 0) advice = `<p class="alert">💡 改為全部使用全山通票可節省 ${yen(-diff)}（${hkd(-diff, rate)}），而且可以每天轉場。</p>`;
    else advice = `<p class="alert ok">目前選擇比全部用全山通票便宜 ${yen(diff)}（${hkd(diff, rate)}）。</p>`;
    el('passAdvice').innerHTML = advice + (rateOk ? '' : '<p class="alert">匯率輸入無效，暫用後備匯率計算。</p>');
    el('stickyJpy').textContent = yen(total);
    el('stickyHkd').textContent = hkd(total, rate);
  };

  // events
  el('bDays').addEventListener('input', () => { buildDays(); calc(); });
  el('bPeople').addEventListener('input', () => {
    const p = clampInt(el('bPeople'), 1, 20, 2);
    if (!roomsTouched) el('bRooms').value = Math.ceil(p / 2);
    if (!rentTouched) el('bRentPeople').value = p;
    calc();
  });
  el('bRooms').addEventListener('input', () => { roomsTouched = true; calc(); });
  el('bRentPeople').addEventListener('input', () => { rentTouched = true; calc(); });
  el('bRoomPrice').addEventListener('input', () => { roomPriceTouched = true; calc(); });
  el('bBase').addEventListener('change', () => { roomPriceTouched = false; setRoomPrice(); calc(); });
  el('dayList').addEventListener('change', e => {
    const s = e.target.closest('select[data-day]');
    if (s) { dayChoices[+s.dataset.day] = s.value; calc(); }
  });
  $$('#budget [data-fill]').forEach(b => b.addEventListener('click', () => {
    const days = clampInt(el('bDays'), 1, 14, 5);
    for (let i = 0; i < days; i++) dayChoices[i] = b.dataset.fill;
    if (b.dataset.fill !== 'valley') { el('bBase').value = b.dataset.fill; roomPriceTouched = false; setRoomPrice(); }
    buildDays(); calc();
  }));
  $$('#budgetForm input, #budgetForm select').forEach(i => {
    if (!['bDays', 'bPeople', 'bRooms', 'bRentPeople', 'bRoomPrice', 'bBase'].includes(i.id)) i.addEventListener('input', calc);
  });
  // 失焦時把輸入修正為合法範圍
  [['bPeople', 1, 20, 2], ['bDays', 1, 14, 5], ['bNights', 0, 21, 5], ['bRooms', 1, 20, 1], ['bShuttle', 0, 10, 2], ['bRentPeople', 0, 20, 2]]
    .forEach(([id, min, max, fb]) => el(id).addEventListener('change', () => {
      el(id).value = clampInt(el(id), min, max, fb);
      if (id === 'bDays') buildDays();
      calc();
    }));
  el('budgetForm').addEventListener('submit', e => e.preventDefault());

  setRoomPrice(); buildDays(); calc();

  // 手機版：填寫表單時底部顯示總額（結果卡已在畫面內時隱藏）
  if ('IntersectionObserver' in window) {
    let formIn = false, resIn = false;
    const upd = () => el('budgetSticky').classList.toggle('show', formIn && !resIn);
    new IntersectionObserver(([en]) => { formIn = en.isIntersecting; upd(); }).observe(el('budgetForm'));
    new IntersectionObserver(([en]) => { resIn = en.isIntersecting; upd(); }, { threshold: 0.25 }).observe(el('budgetResult'));
  }

  // 即時匯率（失敗則保留後備值）
  const ctrl = 'AbortController' in window ? new AbortController() : null;
  const timer = setTimeout(() => ctrl && ctrl.abort(), 6000);
  fetch(meta.exchangeRate.api, ctrl ? { signal: ctrl.signal } : {})
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(j => {
      const v = j && j.rates && j.rates.HKD;
      if (!isNum(v) || v <= 0 || v > 1) throw new Error('bad rate');
      if (document.activeElement !== el('bRate')) el('bRate').value = v.toFixed(4);
      const when = j.time_last_update_utc ? new Date(j.time_last_update_utc).toLocaleDateString('zh-HK') : '今日';
      el('rateHint').textContent = `即時匯率（${when} 更新），可手動修改。`;
      calc();
    })
    .catch(() => { el('rateHint').textContent = `未能取得即時匯率，使用後備匯率 ${meta.exchangeRate.rate}（${meta.exchangeRate.rateDate}），可手動修改。`; })
    .finally(() => clearTimeout(timer));
}

/* ===== CAROUSEL ===== */
function initCarousel(R){
  const track = $('#carouselTrack'), slides = $$('.carousel-slide', track), dots = $$('#carDots button');
  let cur = 0;
  const go = i => {
    cur = (i + slides.length) % slides.length;
    track.style.transform = `translateX(-${cur * 100}%)`;
    slides.forEach((s, j) => { s.tabIndex = j === cur ? 0 : -1; s.setAttribute('aria-hidden', String(j !== cur)); });
    dots.forEach((d, j) => { d.classList.toggle('active', j === cur); d.setAttribute('aria-current', j === cur ? 'true' : 'false'); });
    $('#carCaption').textContent = R[cur].name + ' · ' + R[cur].nameEn;
    $('#carCounter').textContent = `${cur + 1} / ${slides.length}`;
  };
  $('#carPrev').addEventListener('click', () => go(cur - 1));
  $('#carNext').addEventListener('click', () => go(cur + 1));
  dots.forEach((d, j) => d.addEventListener('click', () => go(j)));
  $('#carousel').addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
  });
  // 手機左右滑動
  let sx = null, sy = null;
  track.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  track.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go(cur + (dx < 0 ? 1 : -1));
    sx = sy = null;
  });
  go(0);
}

/* ===== LOCATION MAP ===== */
function initLocationMap(list){
  const box = $('#resortMap');
  const popup = (r, i) => `<div class="popup"><h3>${i + 1}. ${esc(r.name)}</h3>
    <p>1 日券 ${yen(r.ticket.adult1Day)} · 白馬站 ${orDash(r.access.fromHakubaStationMin, v => v + ' 分')}</p>
    <p>${esc(r.location.address)}</p>
    <a class="btn" href="${esc(safeUrl(r.location.googleMapsUrl))}" target="_blank" rel="noopener noreferrer">在 Google Maps 開啟 ↗</a></div>`;

  if (window.L && typeof L.map === 'function') {
    const map = L.map(box, { scrollWheelZoom: false, tap: true, zoomControl: false });
    L.control.zoom({ zoomInTitle: '放大', zoomOutTitle: '縮小' }).addTo(map);
    map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener noreferrer">Leaflet</a>');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18, subdomains: 'abc',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
    }).addTo(map);
    const markers = {};
    list.forEach((r, i) => {
      const icon = L.divIcon({ className: 'pin-wrap', html: `<div class="pin"><span>${i + 1}</span></div>`, iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28] });
      markers[r.id] = L.marker([r.location.lat, r.location.lng], { icon, title: r.name, alt: r.name, keyboard: true })
        .addTo(map).bindPopup(popup(r, i), { maxWidth: 260 });
    });
    const bounds = L.latLngBounds(list.map(r => [r.location.lat, r.location.lng]));
    map.fitBounds(bounds, { padding: [36, 36] });
    // 點擊地圖後才啟用滾輪縮放，避免捲動頁面時誤觸
    map.on('click focus', () => map.scrollWheelZoom.enable());
    box.addEventListener('mouseleave', () => map.scrollWheelZoom.disable());
    $$('[data-focus-marker]').forEach(b => b.addEventListener('click', () => {
      const m = markers[b.dataset.focusMarker];
      if (!m) return;
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
      map.setView(m.getLatLng(), 13);
      m.openPopup();
    }));
    window.addEventListener('resize', () => map.invalidateSize());
    window.__resortMap = { map, markers };
    return;
  }

  // 後備：Leaflet 載入失敗時畫 SVG 示意圖（按經緯度投影）
  const W = 600, H = 460, pad = 60;
  const lats = list.map(r => r.location.lat), lngs = list.map(r => r.location.lng);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats), minLng = Math.min(...lngs) - .03, maxLng = Math.max(...lngs) + .03;
  const x = lng => pad + (lng - minLng) / (maxLng - minLng) * (W - 2 * pad);
  const y = lat => pad + (maxLat - lat) / (maxLat - minLat) * (H - 2 * pad);
  const pts = list.map(r => [x(r.location.lng), y(r.location.lat)]);
  box.innerHTML = `<svg class="map-fallback" viewBox="0 0 ${W} ${H}" role="img" aria-label="雪場位置示意圖">
    <path class="river" d="M${pts.map(p => (p[0] + 40).toFixed(1) + ' ' + p[1].toFixed(1)).join(' L')}"/>
    <text class="axis" x="${W - 20}" y="24" text-anchor="end">N ↑</text>
    ${list.map((r, i) => `<a href="${esc(safeUrl(r.location.googleMapsUrl))}" target="_blank" rel="noopener noreferrer" aria-label="${esc(r.name)} 在 Google Maps 開啟">
      <circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="14" fill="var(--color-primary)" stroke="#fff" stroke-width="3"/>
      <text x="${pts[i][0].toFixed(1)}" y="${(pts[i][1] + 4.5).toFixed(1)}" text-anchor="middle" fill="#fff" style="fill:#fff;font-weight:700">${i + 1}</text>
      <text x="${(pts[i][0] - 22).toFixed(1)}" y="${(pts[i][1] + 5).toFixed(1)}" text-anchor="end">${esc(r.name)}</text></a>`).join('')}
  </svg>`;
  $$('[data-focus-marker]').forEach(b => b.addEventListener('click', () => box.scrollIntoView({ behavior: 'smooth', block: 'center' })));
}

function initScrollSpy(){

  const map = new Map(links.map(a => [a.getAttribute('href').slice(1), a]));

    entries.forEach(en => {

      links.forEach(a => a.classList.remove('active'));
      const a = map.get(en.target.id);
      if (a) a.classList.add('active');

}

/* ===== LIGHTBOX (zoom / pan) ===== */
const LB = (() => {
  const box = $('#lightbox'), stage = $('#lbStage'), img = $('#lbImg'), cap = $('#lbCaption'),
        loading = $('#lbLoading'), level = $('#lbZoomLevel');
  let items = [], idx = 0, lastFocus = null;
  let scale = 1, minScale = 1, tx = 0, ty = 0, natW = 0, natH = 0;
  const MAX = 4;                       // 最多放大至原圖 4 倍
  const pointers = new Map();
  let pinchStart = null, dragStart = null, moved = false;

  const apply = () => {
    img.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
    level.textContent = natW ? Math.round(scale * 100) + '%' : '';
  };
  const clamp = () => {
    const sw = stage.clientWidth, sh = stage.clientHeight, w = natW * scale, h = natH * scale;
    tx = w <= sw ? (sw - w) / 2 : Math.min(0, Math.max(sw - w, tx));
    ty = h <= sh ? (sh - h) / 2 : Math.min(0, Math.max(sh - h, ty));
  };
  const fit = () => {
    if (!natW) return;
    minScale = Math.min(stage.clientWidth / natW, stage.clientHeight / natH, 1);
    scale = minScale; tx = ty = 0; clamp(); apply();
  };
  const zoomAt = (newScale, cx, cy) => {
    newScale = Math.min(MAX, Math.max(minScale, newScale));
    const r = newScale / scale;
    tx = cx - (cx - tx) * r; ty = cy - (cy - ty) * r;
    scale = newScale; clamp(); apply();
  };
  const center = () => [stage.clientWidth / 2, stage.clientHeight / 2];

  const show = i => {
    idx = (i + items.length) % items.length;
    const it = items[idx];
    cap.textContent = `${it.caption}（${idx + 1} / ${items.length}）`;
    natW = 0; level.textContent = '';
    loading.style.display = 'grid'; loading.textContent = '載入全清地圖…';
    img.style.visibility = 'hidden';
    img.onload = () => {
      natW = img.naturalWidth; natH = img.naturalHeight;
      img.style.width = natW + 'px'; img.style.height = natH + 'px';
      loading.style.display = 'none'; img.style.visibility = 'visible'; fit();
    };
    img.onerror = () => { loading.textContent = '地圖載入失敗，請稍後再試。'; };
    img.alt = it.caption;
    img.src = it.full;
  };
  const open = (list, i) => {
    items = list; lastFocus = document.activeElement;
    box.classList.add('open'); box.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    show(i);
    $('#lbClose').focus();
  };
  const close = () => {
    box.classList.remove('open'); box.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    img.removeAttribute('src'); pointers.clear();
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  };

  $('#lbClose').addEventListener('click', close);
  $('#lbPrev').addEventListener('click', () => show(idx - 1));
  $('#lbNext').addEventListener('click', () => show(idx + 1));
  $('#lbZoomIn').addEventListener('click', () => zoomAt(scale * 1.5, ...center()));
  $('#lbZoomOut').addEventListener('click', () => zoomAt(scale / 1.5, ...center()));
  $('#lbReset').addEventListener('click', fit);
  window.addEventListener('resize', () => { if (box.classList.contains('open')) { const s = scale; fit(); if (s > minScale) zoomAt(s, ...center()); } });

  document.addEventListener('keydown', e => {
    if (!box.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') show(idx - 1);
    else if (e.key === 'ArrowRight') show(idx + 1);
    else if (e.key === '+' || e.key === '=') zoomAt(scale * 1.5, ...center());
    else if (e.key === '-') zoomAt(scale / 1.5, ...center());
    else if (e.key === '0') fit();
    else if (e.key === 'Tab') {       // 焦點鎖在燈箱內
      const f = $$('button', box).filter(b => b.offsetParent !== null);
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  stage.addEventListener('wheel', e => {
    if (!natW) return;
    e.preventDefault();
    const rect = stage.getBoundingClientRect();
    zoomAt(scale * Math.exp(-e.deltaY * 0.0015), e.clientX - rect.left, e.clientY - rect.top);
  }, { passive: false });

  stage.addEventListener('dblclick', e => {
    if (!natW || e.target.closest('button')) return;
    const rect = stage.getBoundingClientRect();
    if (scale > minScale * 1.05) fit();
    else zoomAt(Math.max(1, minScale * 2.5), e.clientX - rect.left, e.clientY - rect.top);
  });

  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || !natW) return;
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = false;
    if (pointers.size === 1) { dragStart = { x: e.clientX, y: e.clientY, tx, ty }; stage.classList.add('dragging'); }
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchStart = { dist: Math.hypot(a.x - b.x, a.y - b.y), scale };
      dragStart = null;
    }
  });
  stage.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const rect = stage.getBoundingClientRect();
    if (pointers.size === 2 && pinchStart) {
      const [a, b] = [...pointers.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      zoomAt(pinchStart.scale * dist / pinchStart.dist, (a.x + b.x) / 2 - rect.left, (a.y + b.y) / 2 - rect.top);
      moved = true;
    } else if (dragStart) {
      const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
      tx = dragStart.tx + dx; ty = dragStart.ty + dy; clamp(); apply();
    }
  });
  const end = e => {
    if (!pointers.has(e.pointerId)) return;
    const start = dragStart;
    pointers.delete(e.pointerId);
    // 未放大時左右快速滑動切換地圖
    if (start && pointers.size === 0 && scale <= minScale * 1.01) {
      const dx = e.clientX - start.x;
      if (Math.abs(dx) > 60) show(idx + (dx < 0 ? 1 : -1));
    }
    if (pointers.size < 2) pinchStart = null;
    if (pointers.size === 1) { const p = [...pointers.values()][0]; dragStart = { x: p.x, y: p.y, tx, ty }; }
    if (pointers.size === 0) { dragStart = null; stage.classList.remove('dragging'); }
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);

  return { open, close, state: () => ({ scale, minScale, tx, ty, idx, natW }) };
})();
window.__lb = LB;

function initLightboxTriggers(R){
  const items = R.map(r => ({ full: r.trailMap.full, caption: `${r.name} 雪場地圖` }));
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-lightbox]');
    if (!t) return;
    LB.open(items, +t.dataset.lightbox);
  });
}
</script>
</body>
